name: test
on: [push, pull_request]
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: linux-x86_64
          - runner: ubuntu-22.04-arm
            artifact: linux-aarch64
          - runner: macos-15-intel
            artifact: macos-x86_64
          - runner: macos-15
            artifact: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Build and test static musl Linux binary
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
            apk add --no-cache build-base linux-headers python3
            make clean all test CFLAGS="-O2 -Wall -Wextra -Werror -std=c11 -static"
            cc -O2 -Wall -Wextra -Werror -static tests/linux_network_probe.c -o build/linux-network-probe
            chown -R "$HOST_UID:$HOST_GID" /src/build
          '
      - name: Smoke-test static binary in CentOS 6, 7, and 8 userlands
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          for version in 6 7 8; do
            docker run --rm --entrypoint /bin/sh \
              -v "$PWD/build:/netless:ro" "quay.io/centos/centos:$version" \
              -ec '/netless/netless -- /netless/linux-network-probe'
          done
  windows-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            target: windows-x86_64
          - runner: windows-11-arm
            arch: arm64
            target: windows-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Build launcher and adversarial network probe
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Probe IPv4, IPv6, TCP, UDP, DNS, raw sockets, and descendant inheritance
        shell: pwsh
        run: ./tests/test_windows.ps1
  openbsd-build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run adversarial network tests in OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          prepare: pkg_add gmake python%3.12
          run: gmake clean all test
  freebsd-build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run adversarial network tests in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y gmake python3
          run: gmake clean all test
